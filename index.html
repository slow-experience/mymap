<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>낭만을 찾아서 | 서점과 카페</title>
<style>
/* 기본 레이아웃 */
*{box-sizing:border-box}body{margin:0;font-family:'Malgun Gothic',Arial,sans-serif;color:#29352d;background:#f7f9f4}button,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}
.app{display:flex;height:100vh;height:100dvh}.sidebar{width:385px;min-width:320px;background:#fff;display:flex;flex-direction:column;border-right:1px solid #e1e9e1}.brand{padding:19px 19px 12px;background:#ebf5eb}.brand h1{font-size:23px;margin:0 0 6px;color:#315944}.brand p{font-size:12px;margin:0;color:#607569}
.tabs,.filters,.search-row,.map-actions,.pagination{display:flex;gap:7px}.tabs{padding:13px 16px 5px}.tabs button{flex:1;padding:11px;border:1px solid #cfdfd0;border-radius:10px;background:#fff;font-weight:bold}.tabs button.active{background:#35694b;color:#fff;border-color:#35694b}.filters{padding:7px 16px 12px;flex-wrap:wrap}.filters button{border:1px solid #dde5de;border-radius:20px;background:#fff;padding:7px 10px;font-size:12px}.filters button.active{background:#e6f2e9;border-color:#35734e;color:#24583b}
.search-section{padding:12px 16px;border-top:1px solid #edf1ed}.search-row input{min-width:0;flex:1;border:1px solid #cfdacf;padding:10px;border-radius:8px;font-size:13px}.primary{border:none;background:#3a7854;color:white;border-radius:8px;padding:10px 13px}.secondary{border:1px solid #d6e0d5;background:#fff;border-radius:8px;padding:9px;font-size:12px}.helper{margin:8px 1px 0;font-size:11px;color:#77847a}.status{font-size:12px;background:#f4f7f1;margin:0 16px 9px;padding:10px;border-radius:8px;line-height:1.5}.legend{display:flex;gap:12px;align-items:center;padding:0 16px 10px;font-size:11px;color:#667}.dot{width:10px;height:10px;display:inline-block;border-radius:50%;margin-right:4px}
.results{list-style:none;margin:0;padding:0;overflow:auto;flex:1;border-top:1px solid #edf0ea}.results li{border-bottom:1px solid #edf0ea}.result-card{width:100%;border:0;background:#fff;text-align:left;padding:13px 17px}.result-card:hover{background:#f5faf4}.result-card strong{display:block;font-size:14px;margin-bottom:5px}.result-card span{display:block;color:#657069;font-size:12px;line-height:1.5}.result-card .category{font-size:11px;margin-bottom:3px}.empty{padding:24px 17px;color:#69796b;font-size:13px}.pagination{justify-content:center;align-items:center;padding:11px;min-height:47px}.pagination button{border:1px solid #ddd;background:white;border-radius:6px;padding:6px 9px}.pagination button.active{background:#3a7854;color:#fff}.pagination span{font-size:12px}
.map-panel{position:relative;flex:1;min-width:0}#map{width:100%;height:100%}.map-actions{position:absolute;left:12px;top:12px;z-index:5;flex-wrap:wrap;max-width:calc(100% - 70px)}.map-actions button{border:1px solid #d4dfd4;background:#fff;padding:9px;border-radius:8px;box-shadow:0 2px 8px #0002;font-size:12px}.map-actions button.active{background:#336b4b;color:#fff}.map-loading{position:absolute;inset:0;background:#f2f5f1;z-index:10;display:grid;place-items:center;color:#536255}.hidden{display:none!important}
/* 로드뷰 팝업 */
.roadview-panel{position:absolute;bottom:15px;right:15px;width:min(390px,calc(100% - 30px));height:270px;background:white;border:1px solid #d5e3d6;border-radius:12px;box-shadow:0 4px 18px #0003;z-index:8;overflow:hidden}.roadview-head{height:40px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:13px;font-weight:bold}.roadview-head button{background:none;border:0;font-size:22px}#roadview{width:100%;height:230px}.roadview-message{position:absolute;top:40px;bottom:0;left:0;right:0;display:grid;place-items:center;background:#fff;color:#586;z-index:2;padding:15px;text-align:center;font-size:13px}
/* 안전하게 만든 정보창 */
.info{width:240px;padding:11px;line-height:1.5;font-size:12px;max-height:250px;overflow:auto}.info strong{display:block;font-size:14px;margin-bottom:6px}.info .detail{margin:5px 0}.info a{color:#256e4a;display:inline-block;margin:3px 9px 0 0}.info small{color:#788178}
@media(max-width:700px){.app{flex-direction:column}.sidebar{width:100%;min-width:0;height:53%;border-right:0}.map-panel{height:47%;flex:none}.brand{padding:12px 16px 8px}.brand h1{font-size:20px}.search-section{padding:7px 16px}.tabs{padding-top:8px}.filters{padding-bottom:7px}.roadview-panel{height:220px}#roadview{height:180px}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <header class="brand"><h1>🦥 낭만을 찾아서</h1><p>내 주변 서점과 카페에서 발견하는 느린 하루</p></header>
    <nav class="tabs" aria-label="장소 탭"><button id="bookTab" class="active" type="button" disabled>📚 서점</button><button id="cafeTab" type="button" disabled>☕ 카페</button></nav>
    <div class="filters" id="filters"></div>
    <form id="searchForm" class="search-section">
      <div class="search-row"><input id="searchInput" aria-label="장소 검색어" placeholder="추가 검색어 (예: 만화책)" disabled><button class="primary" id="searchButton" disabled>검색</button></div>
      <p class="helper">선택한 탭의 주변 장소를 검색합니다. 추가 검색어는 서점·카페 키워드 검색에 사용합니다.</p>
    </form>
    <form id="addressForm" class="search-section">
      <div class="search-row"><input id="addressInput" aria-label="이동할 주소" placeholder="주소 입력 (예: 서울 종로구 세종대로 172)" disabled><button class="secondary" id="addressButton" disabled>주소 이동</button></div>
    </form>
    <div class="status" id="status" role="status">지도를 불러오는 중입니다.</div>
    <div class="legend" id="legend"></div>
    <ul class="results" id="results"><li class="empty">지도를 준비하고 있어요.</li></ul>
    <div class="pagination" id="pagination"></div>
  </aside>
  <main class="map-panel">
    <div id="map"></div>
    <div class="map-loading" id="mapLoading">🦥 지도를 불러오는 중...</div>
    <div class="map-actions"><button id="locationButton" disabled>📍 내 위치</button><button id="trafficButton" disabled>🚗 교통정보</button><button id="roadviewButton" disabled>🛣️ 로드뷰 도로</button></div>
    <section id="roadviewPanel" class="roadview-panel hidden" aria-label="로드뷰"><div class="roadview-head"><span>🛣️ 로드뷰</span><button id="closeRoadview" aria-label="닫기">×</button></div><div id="roadview"></div><div id="roadviewMessage" class="roadview-message hidden"></div></section>
  </main>
</div>
<script>
// 카카오 JavaScript 키 및 검색 반경(미터)
const kakaoJavaScriptKey = '0baecf3e086c64ed3871ad502fe24528';
const searchRadius = 5000;
const fallbackCoords = {latitude:37.5665, longitude:126.9780};
const franchiseNames = ['스타벅스','투썸플레이스','이디야','메가커피','메가MGC','컴포즈커피','빽다방','할리스','폴바셋','커피빈','파스쿠찌','엔제리너스','탐앤탐스','더벤티','매머드커피','공차','카페베네','블루보틀'];
const largeBookNames = ['교보문고','영풍문고','YES24','예스24','알라딘 중고서점','아크앤북','반디앤루니스'];
const colors = {indieBook:'#38a169',largeBook:'#70c8eb',personalCafe:'#f2be45',franchiseCafe:'#a787e9'};
const filterSettings = {
  book:[['all','전체 서점'],['indieBook','독립서점(추정)'],['largeBook','대형서점(추정)']],
  cafe:[['all','전체 카페'],['personalCafe','개인 카페(추정)'],['franchiseCafe','프랜차이즈(추정)']]
};
let map,places,geocoder,clusterer,infoWindow,roadview,roadviewClient;
let currentMarker=null;
let searchMarkers=[];
let activeTab='book',activeFilter='all',activePagination=null,activeSearchId=0;
let currentCoords=null,searchCenter=null,latestPlaces=[];
let trafficVisible=false,roadOverlayVisible=false;
const el=(id)=>document.getElementById(id);

// 위치 정보는 SDK와 별도로 요청하고, 결과를 얻은 후 주변을 검색한다.
function requestLocation(){
  return new Promise(resolve=>{
    if(!navigator.geolocation){resolve(null);return;}
    navigator.geolocation.getCurrentPosition(
      pos=>resolve({latitude:pos.coords.latitude,longitude:pos.coords.longitude}),
      ()=>resolve(null),
      {enableHighAccuracy:true,timeout:10000,maximumAge:300000}
    );
  });
}

// SDK를 동적으로 불러오고 완전히 준비된 다음 지도를 생성한다.
function loadSdk(){
  const script=document.createElement('script');
  script.src='https://dapi.kakao.com/v2/maps/sdk.js?appkey='+kakaoJavaScriptKey+'&libraries=services,clusterer&autoload=false';
  script.onload=()=>{
    if(!window.kakao||!kakao.maps){showError('SDK 초기화에 실패했습니다.');return;}
    kakao.maps.load(initializeMap);
  };
  script.onerror=()=>showError('지도 SDK를 불러오지 못했습니다. 키와 등록한 웹 도메인을 확인하세요.');
  document.head.appendChild(script);
}
function showError(message){el('mapLoading').textContent=message;el('status').textContent=message;}

async function initializeMap(){
  const coordinates=await requestLocation();
  currentCoords=coordinates;
  searchCenter=coordinates||fallbackCoords;
  const center=new kakao.maps.LatLng(searchCenter.latitude,searchCenter.longitude);
  map=new kakao.maps.Map(el('map'),{center,level:5});
  places=new kakao.maps.services.Places();
  geocoder=new kakao.maps.services.Geocoder();
  infoWindow=new kakao.maps.InfoWindow({zIndex:10,removable:true});
  clusterer=new kakao.maps.MarkerClusterer({map,averageCenter:true,minLevel:4,gridSize:65});
  roadviewClient=new kakao.maps.RoadviewClient();
  // 마커 뭉침은 넓게 축소한 지도에서만 나타나게 설정한다.
  map.addControl(new kakao.maps.ZoomControl(),kakao.maps.ControlPosition.RIGHT);
  if(currentCoords) drawCurrentMarker(currentCoords);
  el('mapLoading').classList.add('hidden');
  el('status').textContent=currentCoords?'현재 위치를 기준으로 주변을 검색합니다.':'위치를 확인하지 못해 서울시청을 기준으로 검색합니다.';
  for(const id of ['bookTab','cafeTab','searchInput','searchButton','addressInput','addressButton','locationButton','trafficButton','roadviewButton']) el(id).disabled=false;
  bindEvents();
  renderFilters();
  startTabSearch();
}

// 현재 위치는 장소 마커들과 별도로 관리하여 군집에 포함되지 않게 한다.
function drawCurrentMarker(coords){
  if(currentMarker)currentMarker.setMap(null);
  currentMarker=new kakao.maps.Marker({map,position:new kakao.maps.LatLng(coords.latitude,coords.longitude),title:'현재 위치',zIndex:20});
}
function bindEvents(){
  el('bookTab').onclick=()=>changeTab('book');
  el('cafeTab').onclick=()=>changeTab('cafe');
  el('searchForm').onsubmit=e=>{e.preventDefault();startTabSearch();};
  el('addressForm').onsubmit=e=>{e.preventDefault();searchAddress();};
  el('locationButton').onclick=goToMyLocation;
  el('trafficButton').onclick=()=>{
    trafficVisible=!trafficVisible;
    if(trafficVisible)map.addOverlayMapTypeId(kakao.maps.MapTypeId.TRAFFIC);
    else map.removeOverlayMapTypeId(kakao.maps.MapTypeId.TRAFFIC);
    el('trafficButton').classList.toggle('active',trafficVisible);
  };
  el('roadviewButton').onclick=()=>{
    roadOverlayVisible=!roadOverlayVisible;
    if(roadOverlayVisible)map.addOverlayMapTypeId(kakao.maps.MapTypeId.ROADVIEW);
    else map.removeOverlayMapTypeId(kakao.maps.MapTypeId.ROADVIEW);
    el('roadviewButton').classList.toggle('active',roadOverlayVisible);
  };
  el('closeRoadview').onclick=()=>el('roadviewPanel').classList.add('hidden');
}
function changeTab(tab){
  activeTab=tab;activeFilter='all';el('searchInput').value='';
  el('bookTab').classList.toggle('active',tab==='book');
  el('cafeTab').classList.toggle('active',tab==='cafe');
  renderFilters();startTabSearch();
}
function renderFilters(){
  const filters=el('filters');filters.replaceChildren();
  filterSettings[activeTab].forEach(([value,label])=>{
    const button=document.createElement('button');button.type='button';button.textContent=label;
    button.classList.toggle('active',value===activeFilter);
    button.onclick=()=>{activeFilter=value;renderFilters();renderPage(latestPlaces);};
    filters.appendChild(button);
  });
  const pairs=activeTab==='book'?[['독립서점',colors.indieBook],['대형서점',colors.largeBook]]:[['개인 카페',colors.personalCafe],['프랜차이즈',colors.franchiseCafe]];
  el('legend').replaceChildren();
  pairs.forEach(([name,color])=>{
    const item=document.createElement('span');const dot=document.createElement('i');dot.className='dot';dot.style.background=color;
    item.append(dot,document.createTextNode(name));el('legend').append(item);
  });
}

// 장소 이름으로 세부 분류를 추정한다. 카카오 공식 세부분류가 아님.
function classifyPlace(place){
  const name=place.place_name.toLowerCase().replace(/\s/g,'');
  if(activeTab==='book')return largeBookNames.some(word=>name.includes(word.toLowerCase().replace(/\s/g,'')))?'largeBook':'indieBook';
  return franchiseNames.some(word=>name.includes(word.toLowerCase().replace(/\s/g,'')))?'franchiseCafe':'personalCafe';
}
function searchOptions(){
  // 주소로 이동한 경우에도 그 주소를 중심으로 검색한다.
  return {location:new kakao.maps.LatLng(searchCenter.latitude,searchCenter.longitude),radius:searchRadius,sort:kakao.maps.services.SortBy.DISTANCE};
}
function startTabSearch(){
  if(!places)return;
  const query=el('searchInput').value.trim();
  const id=++activeSearchId;
  activePagination=null;latestPlaces=[];
  clearSearchDisplay();
  el('status').textContent='반경 5km 안의 장소를 검색 중입니다...';
  const callback=(data,status,pagination)=>{
    // 탭을 바꾼 뒤 늦게 도착한 이전 검색 결과는 무시한다.
    if(id!==activeSearchId)return;
    if(status===kakao.maps.services.Status.OK){
      activePagination=pagination;latestPlaces=data;renderPage(data);
    }else{
      latestPlaces=[];clearSearchDisplay();
      el('status').textContent=status===kakao.maps.services.Status.ZERO_RESULT?'검색 결과가 없습니다.':'검색 중 문제가 발생했습니다.';
      el('results').innerHTML='<li class="empty">표시할 장소가 없습니다.</li>';
    }
  };
  const options=searchOptions();
  // 카페는 공식 카테고리 코드 CE7로, 서점은 키워드로 검색한다.
  if(activeTab==='cafe'&&!query)places.categorySearch('CE7',callback,options);
  else places.keywordSearch(activeTab==='book'?(query?'서점 '+query:'서점'):('카페 '+query),callback,options);
}
function clearSearchDisplay(){
  if(clusterer)clusterer.clear();
  searchMarkers=[];el('results').replaceChildren();el('pagination').replaceChildren();
  if(infoWindow)infoWindow.close();
  el('roadviewPanel').classList.add('hidden');
}
function renderPage(data){
  clearSearchDisplay();
  const filtered=data.filter(place=>activeFilter==='all'||classifyPlace(place)===activeFilter);
  if(!filtered.length){el('results').innerHTML='<li class="empty">이 페이지에서 해당 분류를 찾지 못했습니다. 다른 페이지도 살펴보세요.</li>';}
  filtered.forEach(place=>{
    const type=classifyPlace(place);
    const position=new kakao.maps.LatLng(Number(place.y),Number(place.x));
    const marker=new kakao.maps.Marker({position,title:place.place_name,image:makeSlothMarker(colors[type])});
    searchMarkers.push(marker);
    kakao.maps.event.addListener(marker,'click',()=>openPlaceInfo(place,marker));
    const li=document.createElement('li');const button=document.createElement('button');button.type='button';button.className='result-card';
    const title=document.createElement('strong');title.textContent=place.place_name;
    const category=document.createElement('span');category.className='category';category.textContent=typeLabel(type)+' · 이름 기반 추정';
    const address=document.createElement('span');address.textContent=place.road_address_name||place.address_name||'주소 정보 없음';
    button.append(title,category,address);
    button.onclick=()=>{map.panTo(position);openPlaceInfo(place,marker);};
    li.append(button);el('results').append(li);
  });
  clusterer.addMarkers(searchMarkers);
  if(filtered.length){
    const bounds=new kakao.maps.LatLngBounds();filtered.forEach(place=>bounds.extend(new kakao.maps.LatLng(Number(place.y),Number(place.x))));
    map.setBounds(bounds);
    // 검색 결과가 좁은 범위에 있어도 최대 확대 레벨을 5로 제한한다.
    if(map.getLevel()<5)map.setLevel(5);
  }
  renderPagination();
  const page=activePagination?activePagination.current:1;
  el('status').textContent=`${page}페이지: ${data.length}개 중 ${filtered.length}개 표시 · 반경 5km · 분류는 추정값`;
}
function typeLabel(type){return {indieBook:'독립서점',largeBook:'대형서점',personalCafe:'개인 카페',franchiseCafe:'프랜차이즈 카페'}[type];}

// 로고나 외부 이미지 없이 SVG로 나무늘보 마커를 만든다.
function makeSlothMarker(color){
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="54" height="68" viewBox="0 0 54 68">
  <path d="M27 66 L10 44 Q1 30 9 15 Q16 3 27 3 Q38 3 45 15 Q53 30 44 44Z" fill="${color}" stroke="#fff" stroke-width="3"/>
  <circle cx="27" cy="27" r="17" fill="#967358"/><ellipse cx="27" cy="31" rx="14" ry="13" fill="#f1d9b4"/>
  <ellipse cx="18" cy="26" rx="5" ry="7" fill="#aa886a"/><ellipse cx="36" cy="26" rx="5" ry="7" fill="#aa886a"/>
  <circle cx="19" cy="27" r="1.8" fill="#342b27"/><circle cx="35" cy="27" r="1.8" fill="#342b27"/>
  <ellipse cx="27" cy="33" rx="3.5" ry="2.5" fill="#4b3934"/><path d="M22 38 Q27 43 32 38" stroke="#4b3934" stroke-width="1.7" fill="none" stroke-linecap="round"/>
  </svg>`;
  const url='data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(svg);
  return new kakao.maps.MarkerImage(url,new kakao.maps.Size(54,68),{offset:new kakao.maps.Point(27,66)});
}

// 카카오 응답에 없는 영업시간은 지어내지 않는다.
function openPlaceInfo(place,marker){
  const content=document.createElement('div');content.className='info';
  const title=document.createElement('strong');title.textContent=place.place_name;content.append(title);
  appendDetail(content,'분류: '+typeLabel(classifyPlace(place))+' (추정)');
  appendDetail(content,'도로명: '+(place.road_address_name||'제공되지 않음'));
  appendDetail(content,'지번: '+(place.address_name||'제공되지 않음'));
  appendDetail(content,'전화: '+(place.phone||'제공되지 않음'));
  appendDetail(content,'영업시간: 카카오맵 상세에서 확인');
  if(place.place_url){const link=document.createElement('a');link.href=place.place_url;link.target='_blank';link.rel='noopener noreferrer';link.textContent='상세·영업시간 보기 ↗';content.append(link);}
  const roadButton=document.createElement('a');roadButton.href='#';roadButton.textContent='로드뷰 보기';
  roadButton.onclick=e=>{e.preventDefault();showRoadview(new kakao.maps.LatLng(Number(place.y),Number(place.x)));};content.append(roadButton);
  infoWindow.setContent(content);infoWindow.open(map,marker);
}
function appendDetail(parent,value){const div=document.createElement('div');div.className='detail';div.textContent=value;parent.append(div);}
function showRoadview(position){
  el('roadviewPanel').classList.remove('hidden');
  const message=el('roadviewMessage');message.textContent='로드뷰를 확인하고 있습니다...';message.classList.remove('hidden');
  if(!roadview)roadview=new kakao.maps.Roadview(el('roadview'));
  roadviewClient.getNearestPanoId(position,60,panoId=>{
    if(el('roadviewPanel').classList.contains('hidden'))return;
    if(panoId){roadview.setPanoId(panoId,position);message.classList.add('hidden');}
    else message.textContent='이 장소 주변에는 제공되는 로드뷰가 없습니다.';
  });
}

// 카카오 검색 콜백의 페이지 객체를 사용한다.
function renderPagination(){
  const panel=el('pagination');panel.replaceChildren();
  if(!activePagination)return;
  const total=activePagination.last,current=activePagination.current;
  const first=Math.max(1,Math.floor((current-1)/5)*5+1);
  const last=Math.min(total,first+4);
  const add=(label,page,disabled=false)=>{
    const button=document.createElement('button');button.textContent=label;button.disabled=disabled;button.classList.toggle('active',page===current&&label===String(page));
    button.onclick=()=>{if(activePagination)activePagination.gotoPage(page);};panel.append(button);
  };
  add('이전',Math.max(1,current-1),current===1);
  for(let page=first;page<=last;page++)add(String(page),page);
  add('다음',Math.min(total,current+1),current===total);
}

// 주소를 좌표로 바꾸고 그 위치 주변 장소를 새로 검색한다.
function searchAddress(){
  const address=el('addressInput').value.trim();if(!address){el('status').textContent='이동할 주소를 입력해주세요.';return;}
  geocoder.addressSearch(address,(result,status)=>{
    if(status!==kakao.maps.services.Status.OK){el('status').textContent='주소를 찾지 못했습니다. 도로명 또는 지번 주소를 입력해주세요.';return;}
    searchCenter={latitude:Number(result[0].y),longitude:Number(result[0].x)};
    map.setCenter(new kakao.maps.LatLng(searchCenter.latitude,searchCenter.longitude));map.setLevel(5);
    startTabSearch();
  });
}
async function goToMyLocation(){
  el('status').textContent='현재 위치를 다시 확인 중입니다...';
  const coordinates=await requestLocation();
  if(!coordinates){el('status').textContent='현재 위치를 가져오지 못했습니다. 브라우저 권한을 확인하세요.';return;}
  currentCoords=coordinates;searchCenter=coordinates;drawCurrentMarker(coordinates);
  map.setCenter(new kakao.maps.LatLng(coordinates.latitude,coordinates.longitude));map.setLevel(5);startTabSearch();
}
